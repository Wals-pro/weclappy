name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile module and examples
        run: python -m compileall -q weclappy.py examples

      - name: Run non-integration tests
        run: python -m pytest -m "not integration" -v

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          assert "weclappy.py" in names, names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
          PY

      - name: Test installation from wheel
        run: |
          python -m venv "$RUNNER_TEMP/weclappy-wheel-smoke"
          "$RUNNER_TEMP/weclappy-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/weclappy-wheel-smoke/bin/python" - <<'PY'
          from importlib.metadata import version

          import weclappy

          assert version("weclappy")
          assert weclappy.Weclapp
          assert weclappy.WeclappAPIError
          PY
