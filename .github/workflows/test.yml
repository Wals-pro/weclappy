name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Check formatting
        run: ruff format --check src tests examples

      - name: Type-check
        run: mypy

      - name: Compile examples
        run: python -m compileall -q examples

      - name: Run non-integration tests with coverage
        run: >-
          pytest -m "not integration"
          --cov=weclappy --cov-report=term-missing --cov-fail-under=90

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())

          for required in ("weclappy/__init__.py", "weclappy/py.typed"):
              assert required in names, (required, sorted(names))
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
          assert not any(name.startswith(("tests/", "examples/", "docs/")) for name in names), names
          PY

      - name: Install the wheel in a clean virtual environment
        run: |
          expected="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          python -m venv "$RUNNER_TEMP/weclappy-wheel-smoke"
          "$RUNNER_TEMP/weclappy-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          EXPECTED_VERSION="$expected" "$RUNNER_TEMP/weclappy-wheel-smoke/bin/python" -c "import os, weclappy; assert weclappy.__version__ == os.environ['EXPECTED_VERSION'], weclappy.__version__; from weclappy import Weclapp; print('weclappy', weclappy.__version__, Weclapp)"
