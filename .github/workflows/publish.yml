name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release and build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Match release tag, package version, and changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import re
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = metadata["project"]["version"]
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version {version!r}; "
                  f"expected {expected_tag!r}."
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})$",
              changelog,
              flags=re.MULTILINE,
          )
          if heading is None:
              raise SystemExit(
                  f"CHANGELOG.md needs a dated '## [{version}] - YYYY-MM-DD' section."
              )
          dt.date.fromisoformat(heading.group(1))
          PY

      - name: Lint and type-check
        run: |
          ruff check src tests examples
          mypy

      - name: Run non-integration tests
        run: pytest -m "not integration" --cov=weclappy --cov-fail-under=90

      - name: Build distributions
        run: |
          rm -rf dist
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())

          for required in ("weclappy/__init__.py", "weclappy/py.typed"):
              assert required in names, (required, sorted(names))
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
          PY

      - name: Test installation from wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv "$RUNNER_TEMP/weclappy-release-smoke"
          "$RUNNER_TEMP/weclappy-release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/weclappy-release-smoke/bin/python" -c "import os, weclappy; assert 'v' + weclappy.__version__ == os.environ['RELEASE_TAG'], weclappy.__version__; from weclappy import Weclapp, WeclappAPIError, WeclappEntity"

      - name: Store distributions for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/weclappy
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
