name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release and build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest build twine

      - name: Match release tag, package version, and changelog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import os
          import re
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = metadata["project"]["version"]
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version {version!r}; "
                  f"expected {expected_tag!r}."
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})$",
              changelog,
              flags=re.MULTILINE,
          )
          if heading is None:
              raise SystemExit(
                  f"CHANGELOG.md needs a dated '## [{version}] - YYYY-MM-DD' section."
              )
          dt.date.fromisoformat(heading.group(1))
          PY

      - name: Run non-integration tests
        run: python -m pytest -m "not integration" -v

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Test installation from wheel
        run: |
          python -m venv "$RUNNER_TEMP/weclappy-release-smoke"
          "$RUNNER_TEMP/weclappy-release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/weclappy-release-smoke/bin/python" - <<'PY'
          from importlib.metadata import version

          import weclappy

          assert version("weclappy")
          assert weclappy.Weclapp
          assert weclappy.WeclappAPIError
          PY

      - name: Store distributions for publishing
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/weclappy
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
